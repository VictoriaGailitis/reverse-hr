name: backend
on: [push, pull_request]
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install uv==0.6.17
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: python scripts/configure.py
      - run: PYTHONPATH=src uv run python scripts/configure_events.py
      - run: docker compose --profile all --profile events config --quiet
      - run: docker compose -f compose.yaml -f compose.test.yaml up -d --wait --wait-timeout 120 postgres rabbitmq
      - run: PYTHONPATH=src uv run python scripts/integration_tests.py
      - run: PYTHONPATH=src uv run python scripts/export_contracts.py
      - run: git diff --exit-code -- contracts
      - run: docker build -t reverse-hr:ci .
      - if: always()
        run: docker compose -f compose.yaml -f compose.test.yaml stop postgres rabbitmq
