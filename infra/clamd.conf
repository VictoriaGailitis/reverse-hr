Foreground yes
TCPSocket 3310
TCPAddr 0.0.0.0
DatabaseDirectory /var/lib/clamav
LogTime yes
LogClean no
LogVerbose no
StreamMaxLength 34M
MaxFileSize 34M
MaxScanSize 100M
MaxRecursion 10
MaxThreads 2
MaxQueue 4
ReadTimeout 15
CommandReadTimeout 15
SendBufTimeout 500
AlertExceedsMax yes
SelfCheck 60
