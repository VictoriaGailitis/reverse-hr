server {
  listen 80;
  server_tokens off;
  access_log off;
  client_max_body_size 1m;
  location = /health/live { return 200 'ok'; add_header Content-Type text/plain; }
  location ^~ /candidate/internal/ { return 404; }
  location /candidate/ { proxy_pass http://candidate:8000/; }
  location ^~ /privacy/internal/ { return 404; }
  location /privacy/ { proxy_pass http://privacy:8000/; }
  location ^~ /employer/internal/ { return 404; }
  location /employer/ { proxy_pass http://employer:8000/; }
  location ^~ /assessment/internal/ { return 404; }
  location ^~ /coding-workspace/internal/ { return 404; }
  location /code-runner/ { proxy_pass http://code-runner:8000/; }
  location /coding-workspace/ { proxy_pass http://coding-workspace:8000/; }
  location /assessment/ { proxy_pass http://assessment:8000/; }
  location ^~ /evaluation/internal/ { return 404; }
  location /evaluation/ { proxy_pass http://evaluation:8000/; }
  location ^~ /matching/internal/ { return 404; }
  location ^~ /hiring/internal/ { return 404; }
  location /matching/ { proxy_pass http://matching:8000/; }
  location /hiring/ { proxy_pass http://hiring:8000/; }
  location ^~ /notification/internal/ { return 404; }
  location /notification/ { proxy_pass http://notification:8000/; }
  location / { return 404; }
}
