server {
  listen 80;
  server_tokens off;
  access_log off;
  client_max_body_size 1m;
  resolver 127.0.0.11 valid=10s ipv6=off;
  location = /health/live { return 200 'ok'; add_header Content-Type text/plain; }
  location ^~ /candidate/internal/ { return 404; }
  location /candidate/ { proxy_pass http://candidate:8000/; }
  location ^~ /privacy/internal/ { return 404; }
  location /privacy/ { proxy_pass http://privacy:8000/; }
  location ^~ /employer/internal/ { return 404; }
  location /employer/ { proxy_pass http://employer:8000/; }
  location ^~ /assessment/internal/ { return 404; }
  location ^~ /coding-workspace/internal/ { return 404; }
  location ^~ /code-runner/internal/ { return 404; }
  location /code-runner/ { proxy_pass http://code-runner:8000/; }
  location /coding-workspace/ { proxy_pass http://coding-workspace:8000/; }
  location /assessment/ { proxy_pass http://assessment:8000/; }
  location ^~ /evaluation/internal/ { return 404; }
  location /evaluation/ { proxy_pass http://evaluation:8000/; }
  location ^~ /matching/internal/ { return 404; }
  location ^~ /hiring/internal/ { return 404; }
  location /matching/ { proxy_pass http://matching:8000/; }
  location /hiring/ { proxy_pass http://hiring:8000/; }
  location ^~ /notification/internal/ { return 404; }
  location /notification/ { proxy_pass http://notification:8000/; }
  location ^~ /media/internal/ { return 404; }
  location /media/ { proxy_pass http://media:8000/; }
  location ^~ /whiteboard/internal/ { return 404; }
  location ^~ /proctoring/internal/ { return 404; }
  location /proctoring/ { proxy_pass http://proctoring:8000/; }
  location /whiteboard/ { proxy_pass http://whiteboard:8000/; }
  location ^~ /achievements/internal/ { return 404; }
  location /achievements/ {
    set $achievements_backend achievements:8000;
    rewrite ^/achievements/(.*)$ /$1 break;
    proxy_pass http://$achievements_backend;
  }
  location ^~ /integration/internal/ { return 404; }
  location /integration/ {
    set $integration_backend integration:8000;
    rewrite ^/integration/(.*)$ /$1 break;
    proxy_pass http://$integration_backend;
  }
  location ^~ /demo-ats/internal/ { return 404; }
  location /demo-ats/ {
    set $demo_ats_backend demo-ats:8000;
    rewrite ^/demo-ats/(.*)$ /$1 break;
    proxy_pass http://$demo_ats_backend;
  }
  location ^~ /audit/internal/ { return 404; }
  location /audit/ {
    set $audit_backend audit:8000;
    rewrite ^/audit/(.*)$ /$1 break;
    proxy_pass http://$audit_backend;
  }
  location / { return 404; }
}
