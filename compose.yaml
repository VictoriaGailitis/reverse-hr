      HR_EVALUATION_LLM_CONFIG: ${EVALUATION_LLM_CONFIG:-null}
      HR_DATABASE_URL: postgresql+psycopg://evaluation:${EVALUATION_DB_PASSWORD:?Generate .env first}@postgres:5432/evaluation
