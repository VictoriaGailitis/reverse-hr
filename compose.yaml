    command: [sh, -c, 'python -m reverse_hr.migrate upgrade head && exec uvicorn reverse_hr.app:create_app --factory --host 0.0.0.0 --port 8000 --no-access-log']
  whiteboard:
    <<: *app
    profiles: [all]
    environment:
      HR_SERVICE_NAME: whiteboard
      HR_ROOT_PATH: /whiteboard
      HR_DATABASE_URL: postgresql+psycopg://whiteboard:${WHITEBOARD_DB_PASSWORD:?Generate .env first}@postgres:5432/whiteboard
    command: [sh, -c, 'python -m reverse_hr.migrate upgrade head && exec uvicorn reverse_hr.app:create_app --factory --host 0.0.0.0 --port 8000 --no-access-log']
