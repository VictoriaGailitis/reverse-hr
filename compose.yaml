      HR_AMQP_URL: amqp://coding-workspace:${CODING_WORKSPACE_AMQP_PASSWORD:?Run configure_events.py first}@rabbitmq:5672/%2F
      HR_EVENT_PRIVATE_KEY_FILE: /run/secrets/signing.key
