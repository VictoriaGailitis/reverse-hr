      HR_AMQP_URL: amqp://code-runner:${CODE_RUNNER_AMQP_PASSWORD:?Run configure_events.py first}@rabbitmq:5672/%2F
      HR_EVENT_PRIVATE_KEY_FILE: /run/secrets/signing.key
